<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{title}} — Zixiao Jolene Wang</title>
<style>
      :root { color-scheme: light; --ink:#333333; --link:#1a6fb5; --rule:#e5e5e5; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; scroll-padding-top:44px; }
      body { margin:0; background:#fff; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-size:16px; line-height:1.6; }
      a { color:var(--link); text-decoration:none; text-underline-offset:3px; }
      a:visited { color:#6b5b95; }
      a:hover { text-decoration:underline; }
      a:focus-visible { outline:2px solid var(--link); outline-offset:5px; }
      .site-header { position:fixed; top:70px; bottom:36px; left:max(36px,calc((100vw - 930px)/2)); width:190px; overflow-y:auto; }
      .header-inner { display:flex; flex-direction:column; align-items:flex-start; }

      nav { display:flex; flex-direction:column; align-items:flex-start; gap:12px; margin-top:22px; padding-left:0; }
      nav a { position:relative; color:var(--ink); font:inherit; }
      nav a[aria-current="location"] { color:var(--ink); }
      nav a[aria-current="location"]::before { content:""; position:absolute; left:-12px; top:5px; width:2px; height:15px; background:var(--ink); }
      .links { display:flex; flex-direction:column; align-items:flex-start; gap:6px; margin-top:32px; }
      .links a { color:var(--link); }
      .separator { display:none; }
      main { width:calc(100% - 310px); max-width:650px; margin-left:max(260px,calc((100vw - 930px)/2 + 250px)); padding:67px 0 42px; }
      h1 { color:#222; font-size:2.4rem; line-height:1.2; font-weight:600; letter-spacing:normal; margin:0 0 26px; }
      .profile-photo { display:block; width:190px; height:245px; object-fit:cover; object-position:50% 40%; border-radius:3px; }
      .intro-top { display:grid; grid-template-columns:minmax(0,1fr) 190px; gap:30px; align-items:start; }
      .intro-bio p:last-child { margin-bottom:0; }
      .about-research { margin-top:20px; }
      p { margin:0 0 15px; }
      .phonetic { font:inherit; }
      .email { margin-top:20px; }
      section { margin-top:32px; }
      h2 { color:#222; font-size:20px; line-height:1.6; font-weight:600; margin:0 0 16px; }

      h3 { font-size:inherit; line-height:inherit; font-weight:600; margin:18px 0 5px; }

      ul { list-style:none; margin:0; padding:0; }
      .news-list, .internship-list, .pub-list { list-style:disc; padding-left:22px; }
      .news-list li { margin-bottom:12px; }
      .news-list time { font:inherit; white-space:nowrap; }
      .pub-list li { margin-bottom:18px; }
      .pub-list li:last-child { margin-bottom:0; }
      .pub-title { display:block; font:inherit; color:var(--link); }
      .pub-title:visited, #talks .presentation-list a:visited, .links a:visited, footer a:visited { color:#6b5b95; }
      .pub-title:hover { text-decoration:underline; }
      .pub-authors { margin-top:2px; }
      .pub-authors strong, .pub-venue em { font:inherit; color:inherit; }
      .pub-venue { font:inherit; margin-top:2px; }
      #talks .presentation-year { font-size:inherit; line-height:inherit; font-weight:600; margin:24px 0 12px; }
      #talks .presentation-list { list-style:disc; padding-left:22px; margin:0; }
      #talks .presentation-list li { padding-left:2px; margin:0 0 12px; line-height:1.6; }
      #talks .presentation-list a { color:var(--link); font-weight:400; }
      footer { display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:48px; }
      footer a { color:var(--link); }
      .skip-link { position:fixed; top:-90px; left:16px; z-index:30; padding:8px 12px; background:white; }
      .skip-link:focus { top:12px; }
      @media(min-width:1500px) { .site-header { top:88px; } main { padding-top:85px; } }
      @media(max-width:760px) {
        html { scroll-padding-top:82px; }
        .site-header { position:sticky; top:0; bottom:auto; left:auto; width:100%; overflow:visible; z-index:10; background:white; border-bottom:1px solid var(--rule); }
        .header-inner { max-width:650px; margin:auto; padding:14px 24px; }
        .links { display:none; }
        .intro-top { grid-template-columns:minmax(0,1fr) 140px; gap:24px; }
        .profile-photo { width:140px; height:180px; }
        nav { width:100%; flex-direction:row; flex-wrap:wrap; justify-content:space-between; gap:12px; margin:0; padding:0; border:0; }
        nav a { padding:3px 0; }
        nav a[aria-current="location"]::before { top:auto; bottom:-5px; left:0; width:100%; height:1px; }
        main { width:auto; max-width:650px; margin:0 auto; padding:34px 24px; }
        h1 { font-size:2.4rem; letter-spacing:normal; margin-bottom:23px; }
              .mobile-links { display:flex; flex-direction:row; flex-wrap:wrap; gap:16px; margin-top:16px; }
        section { margin-top:32px; }
        h2 { font-size:20px; }
        .news-list li { column-gap:14px; }
        .pub-title { font-size:inherit; }
      }
      @media(max-width:560px) {
        .intro-top { grid-template-columns:minmax(0,1fr) 110px; gap:18px; }
        .intro-bio { display:contents; }
        .intro-top h1 { grid-column:1; grid-row:1; align-self:center; margin:0; font-size:2rem; }
        .intro-top > .profile-photo { grid-column:2; grid-row:1; width:110px; height:142px; }
        .intro-bio p { grid-column:1 / -1; margin:0; }
      }
      @media(min-width:761px) { .mobile-links { display:none; } }
      @media(max-width:380px) { html { scroll-padding-top:120px; } body { font-size:16px; } h1 { font-size:31px; } main { padding-left:20px; padding-right:20px; } .header-inner { padding-left:20px; padding-right:20px; }  }
      @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }

html { scroll-padding-top:24px; }
.post h1 { font-size:28px; line-height:1.3; margin-bottom:20px; }
.post h2 { margin-top:26px; margin-bottom:12px; }
.post article ul { list-style:disc; padding-left:22px; margin-bottom:20px; }
.post article li { margin-bottom:10px; }
.post article code { font-size:.9em; overflow-wrap:anywhere; }
.post article img { display:block; width:100%; height:auto; border:1px solid var(--rule); }
.dashboard-actions { display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; margin:18px 0 26px; }
.dashboard-actions span { color:#555; font-size:15px; }
.post a.dashboard-cta { display:inline-flex; align-items:center; justify-content:center; padding:12px 20px; border-radius:4px; background:#155da0; color:#fff; font-weight:600; line-height:1.5; text-align:center; text-decoration:none; }
.post a.dashboard-cta:hover { background:#104b83; }
.post a.dashboard-cta:focus-visible { outline:3px solid #155da0; outline-offset:4px; }
@media(min-width:761px) {
  .site-header { position:absolute; top:40px; bottom:auto; left:clamp(24px,4.4vw,76px); width:160px; overflow:visible; }
  .site-header nav { margin-top:0; }
  main.post { width:auto; max-width:none; margin-left:clamp(240px,22vw,376px); margin-right:clamp(24px,5.2vw,90px); padding:38px 0 42px; }
}
@media(max-width:760px) {
  .site-header { position:static; }
  main.post { width:auto; max-width:none; margin:0; padding:24px 24px 36px; }
  .post h1 { font-size:26px; }
  .dashboard-actions { align-items:stretch; flex-direction:column; gap:8px; }
}
@media(max-width:380px) { main.post { padding-left:20px; padding-right:20px; } }
</style>
</head>
<body>
<a class="skip-link" href="#post">Skip to content</a>
<header class="site-header">
      <div class="header-inner">
<nav aria-label="Main navigation">
          <a href="https://zixiaowang17.github.io/#about">About</a>
          <a href="https://zixiaowang17.github.io/#internship">Internship</a>
          <a href="https://zixiaowang17.github.io/#news">News</a>
          <a href="https://zixiaowang17.github.io/" aria-current="location">Blog</a>
          <a href="https://zixiaowang17.github.io/#publications">Papers</a>
          <a href="https://zixiaowang17.github.io/#talks">Talks</a>
        </nav>
          <div class="links">
            <a
              class="link-item"
              href="https://scholar.google.com/citations?user=QHao6yQAAAAJ"
              >Google Scholar</a
            ><span class="separator">/</span
            ><a
              class="link-item"
              href="https://github.com/zixiaowang17"
              >GitHub</a
            ><span class="separator">/</span
            ><a
              class="link-item"
              href="https://www.linkedin.com/in/zixiao-w-3a79811a5"
              >LinkedIn</a
            >
          </div>
      </div>
    </header>
<main class="post" id="post">
<article>
{{body}}
</article>
<footer><a href="https://zixiaowang17.github.io/">Back to blog</a><a href="#post">Back to top</a></footer>
</main>
</body>
</html>
